name: xet-vong

# Luật §8.4: mỗi 7 ngày (thứ Hai) máy chạy nghiem-thu/do_vong.py và mở issue xet-vong kèm bảng.
# Cửa sổ đo 14 ngày, trượt: tỉ lệ thay đổi gây hỏng chỉ tính PR đã merge đủ 7 ngày, cửa sổ 7 ngày thì luôn ra 0.
# Script hỏng thì job đỏ và không mở issue: hoãn, không đoán.
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: xet-vong
  cancel-in-progress: false

jobs:
  xet-vong:
    name: xet-vong
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Đo vòng và mở issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          python3 nghiem-thu/do_vong.py --repo "$REPO" --ngay 14 > "$RUNNER_TEMP/bang.md"
          gh label create xet-vong --repo "$REPO" --color 5319e7 --description "Bảng xét vòng 7 ngày, cửa sổ 14 ngày (luật §8.4)" --force
          gh issue create --repo "$REPO" --label xet-vong --title "Xét vòng $(date -u +%F)" --body-file "$RUNNER_TEMP/bang.md"
