name: cong-nhanh

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cong-nhanh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cong-nhanh:
    name: cong-nhanh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chạy kiểm tra
        run: sh ./kiem-tra.sh
