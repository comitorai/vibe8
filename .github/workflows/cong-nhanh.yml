name: cong-nhanh

on:
  pull_request:
    # Chỉ lúc mở PR và đẩy commit. edited, reopened có thể chạy ref merge cũ mà mang SHA mới, cổng không phân biệt được (L8).
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  cong-nhanh:
    name: cong-nhanh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chạy kiểm tra
        run: sh ./kiem-tra.sh
