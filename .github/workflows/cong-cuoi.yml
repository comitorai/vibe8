# Cổng cuối. Không checkout, không chạy mã PR: mã cổng lấy từ nhánh gốc, diff đọc qua API.
#
# Tên job KHÔNG được là `cong-cuoi`: check required do App phát, job Actions không được trùng tên.
#
# Hai sự kiện, đều chạy workflow của nhánh gốc nên qua được environment `gate` (docs/bao-mat.md):
# - pull_request_target: PR mở, có commit mới, đổi base. CI chưa xong thì phát failure.
# - workflow_run: CI xong, hoặc có lượt duyệt. Không gọi trực tiếp `pull_request_review` vì sự kiện đó
#   xét environment theo refs/pull/N/merge nên bị từ chối; không được nới `gate`, khoá App sẽ lộ.
# Sự kiện chỉ đánh thức cổng. Tên workflow giả được, nên quyết định chỉ lấy từ API.
name: cong-cuoi

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] không checkout mã PR, không đưa dữ liệu PR vào run
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run: # zizmor: ignore[dangerous-triggers] chỉ dùng head_sha, kiểm dạng trước khi gọi API
    workflows: [cong-nhanh, tin-hieu-duyet]
    types: [completed]

permissions: {}

concurrency:
  # Theo SHA và không huỷ: lượt đang chờ luôn chạy sau, đọc dữ liệu mới nhất, nên phát sau cùng.
  group: cong-cuoi-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  phat:
    name: phat-check-cuoi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gate
    permissions:
      contents: read
    steps:
      - name: Lấy mã cổng từ nhánh gốc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Tạo token App quyền tối thiểu
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.XUONG_APP_CLIENT_ID }}
          private-key: ${{ secrets.XUONG_APP_KEY }}
          permission-actions: read
          permission-checks: write
          permission-pull-requests: read
      - name: Xét PR và phát check
        env:
          XUONG_TOKEN_APP: ${{ steps.token.outputs.token }}
          XUONG_PR: ${{ github.event.pull_request.number }}
          XUONG_SHA: ${{ github.event.workflow_run.head_sha }}
          XUONG_NGUOI_DUYET: ${{ vars.XUONG_NGUOI_DUYET }}
        run: python3 -m cong.gate_app
